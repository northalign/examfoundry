[package]
name = "exam-foundry"
version = "0.9.0"
description = "Exam Foundry desktop app"
authors = ["Exam Foundry"]
edition = "2021"

[lib]
name = "exam_foundry_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
